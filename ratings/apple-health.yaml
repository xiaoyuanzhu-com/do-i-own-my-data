date: 2026-03-04
reviewer: xiaoyuanzhu

criteria:
  read:
    rating: partial
    notes: >
      Apple Health supports bulk export via the Health app's "Export All Health Data"
      feature, producing a ZIP with export.xml (all health samples) and export_cda.xml
      (clinical documents). No third-party tool is needed. However, there is no web API
      or server-side API — HealthKit only works on-device for iOS/watchOS apps. HealthKit
      supports HKObserverQuery with background delivery for near-real-time on-device
      notifications, but there are no webhooks, no push to external servers, and no
      streaming API. Update frequency is limited (~4 background updates/hour on watchOS).
      The export is complete, but programmatic and real-time access is device-only.

  write:
    rating: partial
    notes: >
      HealthKit allows third-party apps to write health data (steps, workouts, heart rate,
      etc.) with explicit user permission per data type. However, this is on-device only —
      there is no web API or server-side write capability. There is no built-in "import from
      file" or "import from another service" feature in the Health app itself. To bring data
      in, you need a third-party iOS app that reads your file and writes to HealthKit.

  understand:
    rating: partial
    notes: >
      Exported data uses XML, an open format, but the schema for export.xml is
      Apple-proprietary — there is no published XSD or formal specification. Clinical
      records use HL7 CDA standard. Health Records from providers use FHIR R4 (an open
      healthcare interoperability standard). The core fitness and wellness data in
      export.xml, while readable, does not follow an industry-standard schema and
      requires custom parsing. Common data types (steps, heart rate) are straightforward
      to interpret; sleep and nutrition schemas are less standardized across platforms.

  delete:
    rating: "yes"
    notes: >
      You can delete health data granularly or in bulk. In the Health app, navigate to a
      data category, tap "Show All Data," then use Edit to delete individual records or
      "Delete All" for that category. You can also delete all data from a specific source
      device via Settings > Health > Data Access & Devices. To remove data from iCloud,
      disable Health sync and delete from iCloud storage. Deleting the Health app alone
      does not remove data.

  ownership:
    rating: "no"
    notes: >
      Apple's privacy policy states that health data is encrypted end-to-end when synced
      via iCloud. Apple does not access, sell, or use HealthKit data for advertising or
      AI training. Health data is processed on-device. Third-party apps that access
      HealthKit must comply with Apple's developer guidelines prohibiting use of health
      data for advertising, data brokering, or purposes beyond health/fitness.

  agent_friendly:
    rating: "no"
    notes: >
      There is no web API, REST endpoint, or server-side programmatic access. All data
      access requires an iOS/watchOS app running on the user's device through HealthKit.
      An AI agent cannot directly query Apple Health from a server or desktop application.
      The bulk export is manual (tap in the Health app), not automatable. Building an
      agent would require a companion iOS app as a bridge, adding significant friction.

