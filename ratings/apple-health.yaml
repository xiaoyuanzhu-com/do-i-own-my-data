date: 2026-03-04
reviewer: xiaoyuanzhu

criteria:
  api:
    rating: partial
    notes: >
      HealthKit provides a comprehensive on-device API for iOS/watchOS apps to read and write
      health data (steps, heart rate, sleep, workouts, etc.) with explicit user consent. However,
      there is no web API or server-side API — all access must happen through an app running on
      the user's iPhone or Apple Watch. You cannot query your health data from a backend or
      desktop application directly. Third-party apps must request per-type read/write permissions.
  export:
    rating: "yes"
    notes: >
      The Health app on iPhone provides a built-in "Export All Health Data" feature accessible
      from your profile. It produces a ZIP archive containing export.xml (all health samples)
      and export_cda.xml (clinical documents in CDA format). The export includes all data types —
      activity, vitals, lab results, workouts, nutrition, etc. No third-party tool is required.
  open_format:
    rating: partial
    notes: >
      Exported data uses XML, which is an open format, but the schema for export.xml is
      Apple-proprietary — there is no published XSD or formal specification. Clinical records
      use the HL7 CDA (Clinical Document Architecture) standard. Health Records pulled from
      providers use FHIR R4 (an open healthcare interoperability standard). The core fitness
      and wellness data in export.xml, while readable, does not follow an industry-standard
      schema and requires custom parsing.
  realtime_access:
    rating: partial
    notes: >
      HealthKit supports HKObserverQuery, a long-running query that notifies your app when
      matching samples are saved or deleted. Background delivery is available via the
      enableBackgroundDelivery entitlement, allowing updates even when your app is not in the
      foreground. However, update frequency is limited (e.g., watchOS apps get roughly 4
      background updates per hour). There are no webhooks, no push notifications to external
      servers, and no streaming API — real-time access is confined to on-device iOS/watchOS apps.
  deletion:
    rating: "yes"
    notes: >
      You can delete health data granularly or in bulk. In the Health app, navigate to a data
      category, tap "Show All Data," then use Edit to delete individual records or "Delete All"
      for that category. You can also delete all data from a specific source device via
      Settings > Health > Data Access & Devices. To remove data from iCloud, disable Health
      sync and delete from iCloud storage. Deleting the Health app alone does not remove data.
  portability:
    rating: partial
    notes: >
      The exported XML can be parsed with standard tools (Python, etc.) and converted to CSV
      or other formats, but this requires technical effort — Apple provides no import tool for
      other platforms. Clinical records use FHIR R4 which is interoperable in theory, but
      FHIR-capable consumer apps remain rare (roughly 1.4% of iOS health apps). Common data
      like steps, heart rate, and workouts transfer reasonably well; sleep and nutrition data
      often have incompatible schemas across platforms. There is no built-in "import from
      another service" feature.

