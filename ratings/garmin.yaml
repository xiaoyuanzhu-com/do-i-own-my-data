date: 2026-03-04
reviewer: xiaoyuanzhu

criteria:
  api:
    rating: partial
    notes: >
      Garmin offers a Connect Developer Program with Health API and Activity API,
      but access is restricted to approved business developers — there is no
      personal-use API. Individual users cannot get API keys for their own data.
      Unofficial Python libraries (garminconnect on PyPI) exist but rely on
      screen-scraping Garmin Connect credentials, which violates Garmin's ToS.
  export:
    rating: "yes"
    notes: >
      Garmin provides a full account data export via the Data Management portal
      at garmin.com/account/datamanagement (introduced in 2018 for GDPR compliance).
      You request a download, and Garmin emails you a link to a ZIP file containing
      all your data, typically within 48 hours. Individual activities can also be
      exported one at a time from the Garmin Connect web interface.
  open_format:
    rating: "yes"
    notes: >
      Activities export in FIT (Garmin's binary but openly documented format),
      GPX (open XML standard), and TCX (Garmin's XML extension of GPX). The FIT
      SDK is publicly available. The bulk data export includes original FIT files.
      Activity summaries are available as CSV. All three activity formats are
      widely supported by fitness platforms.
  realtime_access:
    rating: partial
    notes: >
      The official Health API supports both push and ping/pull architectures,
      delivering notifications within seconds of a device sync. However, this
      is only available to approved business developers, not individual users.
      There is no user-facing real-time data stream or webhook. On-device
      Connect IQ apps can access sensor data in real time.
  deletion:
    rating: partial
    notes: >
      You can delete individual activities and daily monitoring data from
      Garmin Connect. Full account deletion is available and removes data
      from Garmin Connect, Garmin Express, and linked services. However,
      Garmin's retention policy on backups and processing systems is not
      fully transparent — the support page notes it "may take some time"
      for complete removal.
  portability:
    rating: "yes"
    notes: >
      Garmin data transfers well to competing platforms. Strava supports direct
      sync from Garmin Connect and can import GPX/TCX/FIT files. Most major
      fitness platforms (Strava, TrainingPeaks, Runkeeper, Ride with GPS) accept
      FIT, GPX, and TCX imports. The bulk export ZIP contains original FIT files
      that preserve all recorded metrics.

