date: 2026-03-04
reviewer: xiaoyuanzhu

criteria:
  read:
    rating: partial
    notes: >
      Google Takeout allows bulk export of all photos and videos as ZIP files, though
      exports can take hours or days. However, the Library API read-only scopes were
      removed on March 31, 2025 — apps can now only access media they themselves created.
      The new Picker API requires manual user selection via Google-controlled UI, with no
      way to programmatically enumerate the full library. The Data Portability API has
      limited Google Photos support and is region-restricted (EU/UK). There is no webhook,
      push notification, or streaming API for real-time access. Bulk export works, but
      programmatic and real-time access is severely degraded.

  write:
    rating: partial
    notes: >
      The Photos API allows uploading media items, but uploaded items can only be placed
      in albums created by the same app — they cannot be added to the user's main library
      directly. There is no bulk import tool for migrating from another service into
      Google Photos. Google does support server-side transfer from iCloud Photos via the
      Data Transfer Initiative, but only inbound from Apple. Manual upload via the web UI
      or mobile app is always available.

  understand:
    rating: partial
    notes: >
      Photos are exported in their original formats (JPEG, PNG, GIF, WebP, AVIF, RAW),
      though Google may re-compress images uploaded under "Storage saver" quality. The key
      problem is metadata: EXIF data is stripped from many photos and stored in separate
      proprietary JSON sidecar files (renamed in late 2024 to
      IMG_1234.jpg.supplemental-metadata.json). Users must use third-party tools like
      ExifTool scripts to merge metadata back into files. Videos export in standard
      formats (MP4, MOV, MKV). Album structure and AI-generated metadata (face tags,
      object labels) are not included in the export.

  delete:
    rating: partial
    notes: >
      Users can delete photos through the web UI and mobile apps, but there is no
      "delete all" button — bulk deletion requires selecting photos in batches or using
      third-party browser extensions. The API only allows deleting media items the app
      itself created. Deleted photos go to Trash and are permanently removed after 60
      days. Google's data retention policies for backups and ML training data derived
      from photos are not fully transparent.

  ownership:
    rating: partial
    notes: >
      Google's ToS states you retain ownership of your content, but you grant Google a
      worldwide, royalty-free license to use, host, store, reproduce, modify, create
      derivative works, communicate, publish, and distribute your content. Google uses
      photos for improving services including AI/ML features (face recognition, scene
      detection, search). Google Photos data may be used to train Google's AI models
      unless users opt out via specific settings. The scope of the license is broad
      relative to what's needed to provide the service.

  agent_friendly:
    rating: "no"
    notes: >
      Since the Library API read scopes were removed in March 2025, there is no way for
      an AI agent to programmatically read a user's photo library. The Picker API requires
      manual user interaction through a Google-controlled UI. Bulk export via Takeout is
      manual and not automatable via API. The Data Portability API is limited and
      region-restricted. An agent would have to rely on scraping or manual user steps,
      making automated workflows impractical.

