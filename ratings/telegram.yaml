date: 2026-03-04
reviewer: xiaoyuanzhu

criteria:
  read:
    rating: "yes"
    notes: >
      Telegram provides excellent data access across all dimensions. Telegram Desktop
      has a built-in "Export Telegram data" feature for bulk export of all chats, media,
      and contacts with no time limit. The Bot API supports long polling and webhooks for
      real-time message delivery. For full access, TDLib (Telegram Database Library) and
      the MTProto client API allow user-authenticated apps to read all messages, contacts,
      media, and chat history — essentially anything the official client can do. TDLib
      provides bindings for C++, Java, .NET, and a JSON interface. Real-time streaming
      is supported via persistent MTProto connections.

  write:
    rating: "yes"
    notes: >
      Telegram supports importing chat history from WhatsApp, Line, and KakaoTalk into
      Telegram chats. The Bot API allows sending messages, media, and files programmatically.
      TDLib and the MTProto API provide full write capabilities — sending messages, creating
      groups, uploading media, managing contacts — equivalent to what the official client
      can do. Users can also forward and share content freely between chats.

  understand:
    rating: "yes"
    notes: >
      Telegram Desktop exports data in either machine-readable JSON or human-readable
      HTML, at the user's choice. The JSON export produces a result.json file with a
      documented schema (published at core.telegram.org/import-export) covering user
      info, contacts, chats, messages, and media references. The HTML export generates
      browsable pages with an index. Both formats are open, well-structured, and require
      no proprietary tools. Media files are exported as original files alongside the
      structured data.

  delete:
    rating: "yes"
    notes: >
      Telegram allows deletion of individual messages from both sides in private chats
      with no time limit — the "unsend" feature removes messages for both sender and
      recipient. Group admins can delete any message for all members. Auto-delete timers
      can be set per chat (24 hours to 1 year). Full account deletion is available at
      my.telegram.org/auth and removes all cloud-stored messages, media, contacts, and
      account data. Accounts also self-destruct after a configurable inactivity period
      (1-12 months). Note: some metadata (IP addresses, device info) may be retained up
      to 12 months after deletion.

  ownership:
    rating: "no"
    notes: >
      Telegram's privacy policy states that messages in regular cloud chats are stored
      encrypted on Telegram's servers to enable multi-device sync, but Telegram does not
      use message content for advertising or sell user data to third parties. Secret chats
      use end-to-end encryption and are not stored on servers. Telegram's business model
      relies on Telegram Premium subscriptions and sponsored messages in large public
      channels (not private chats). Telegram does not claim ownership of user content
      beyond what's needed to operate the service.

  agent_friendly:
    rating: "yes"
    notes: >
      Telegram is highly agent-friendly. TDLib provides a complete, well-documented
      client library with bindings for multiple languages, supporting all read/write
      operations programmatically. The Bot API offers a simple HTTPS interface with
      webhooks for real-time event handling. Authentication uses api_id/api_hash from
      my.telegram.org plus standard phone-number verification. There are no CAPTCHAs
      or anti-automation barriers for legitimate API usage. Rate limits are generous.
      Multiple mature third-party libraries exist (Telethon, GramJS, WTelegramClient).

