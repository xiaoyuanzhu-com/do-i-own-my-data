date: 2026-03-12
models:
  - claude-sonnet-4-20250514

criteria:
  read:
    value: "yes"
    by_model:
      claude-sonnet-4-20250514:
        value: "yes"
        checks:
          - id: bulk-export
            result: true
            evidence: "Telegram Desktop provides a built-in bulk export tool via Settings > Advanced > Export Telegram Data, allowing users to export all their data at once."
            source: "https://telegram.org/blog/export-and-more"
          - id: covers-all-types
            result: true
            evidence: "The export includes chats, media (photos, videos, voice messages, stickers), contacts, account information, stories, profile pictures, and bot conversations."
            source: "https://core.telegram.org/import-export"
          - id: open-format
            result: true
            evidence: "Telegram exports data in JSON (both human-readable and machine-optimized variants) and HTML formats, both open standards."
            source: "https://core.telegram.org/import-export"
          - id: api-read
            result: true
            evidence: "Telegram provides both a Bot API (HTTP-based) and a full MTProto API (via TDLib) for programmatic data access, both publicly documented."
            source: "https://core.telegram.org/bots/api"
          - id: realtime-read
            result: true
            evidence: "The Bot API supports webhooks and long polling for real-time message updates, and the MTProto API provides persistent connections with real-time event streaming."
            source: "https://core.telegram.org/bots/api"
    notes: "Telegram offers excellent read access through both a comprehensive desktop export tool (JSON/HTML) and well-documented APIs with real-time capabilities."

  write:
    value: "yes"
    by_model:
      claude-sonnet-4-20250514:
        value: "yes"
        checks:
          - id: import-from-file
            result: true
            evidence: "Telegram supports importing chat history from exported files (e.g., WhatsApp .txt exports) directly into chats, including text and media."
            source: "https://telegram.org/blog/move-history"
          - id: import-from-service
            result: true
            evidence: "Telegram natively supports migrating chat history from WhatsApp, Line, and KakaoTalk via share-sheet integration on both iOS and Android."
            source: "https://telegram.org/blog/move-history"
          - id: api-write
            result: true
            evidence: "The Bot API supports sending messages (text, photos, videos, documents, audio, etc.), editing messages, and managing chats programmatically via documented HTTP endpoints."
            source: "https://core.telegram.org/bots/api"
          - id: bulk-upload
            result: true
            evidence: "Via the Bot API, bots can send up to 30 messages per second, enabling bulk operations. The import feature also handles entire chat histories at once."
            source: "https://core.telegram.org/bots/faq"
    notes: "Telegram supports writing data through native import from other services, file-based import, and a full-featured Bot API with bulk capabilities."

  understand:
    value: "yes"
    by_model:
      claude-sonnet-4-20250514:
        value: "yes"
        checks:
          - id: open-format
            result: true
            evidence: "Exported data uses JSON and HTML, both open non-proprietary formats that can be read by any standard tool."
            source: "https://core.telegram.org/import-export"
          - id: documented-schema
            result: true
            evidence: "Telegram publishes the export data schema at core.telegram.org/import-export, documenting the structure of chat objects, message objects, text entities, and other data types."
            source: "https://core.telegram.org/import-export"
          - id: standard-schema
            result: false
            evidence: "The export schema is Telegram-specific and does not follow an industry-standard messaging schema such as MBOX or any W3C/IETF standard."
            source: "https://core.telegram.org/import-export"
          - id: human-readable
            result: true
            evidence: "The JSON export uses readable field names and the HTML export is directly viewable in a browser."
            source: "https://core.telegram.org/import-export"
    notes: "Telegram exports are in open, documented, human-readable formats. The schema is vendor-specific but well-documented."

  delete:
    value: "yes"
    by_model:
      claude-sonnet-4-20250514:
        value: "yes"
        checks:
          - id: granular-delete
            result: true
            evidence: "Users can delete individual messages (for themselves or for everyone), clear entire chat histories, and set auto-delete timers (24h or 7 days) on a per-chat basis."
            source: "https://telegram.org/blog/autodelete-inv2"
          - id: full-delete
            result: true
            evidence: "Users can fully delete their account via my.telegram.org/deactivate, which removes all messages, media, contacts, and cloud data. Accounts also auto-delete after a configurable inactivity period."
            source: "https://telegram.org/faq"
          - id: clear-retention
            result: true
            evidence: "Telegram's privacy policy states IP addresses are retained for no more than 12 months, accounts auto-delete after the configured inactivity period, and metadata retention timelines are published."
            source: "https://telegram.org/privacy"
          - id: backup-removal
            result: false
            evidence: "Telegram's privacy policy notes that certain metadata (phone number, IP addresses, device info) may be retained even after account deletion, with no explicit timeline for backup removal."
            source: "https://telegram.org/privacy"
    notes: "Telegram provides strong deletion capabilities including granular message deletion, full account deletion, and clear retention policies, though some metadata persists after deletion."

  ownership:
    value: "no"
    by_model:
      claude-sonnet-4-20250514:
        value: "no"
        checks:
          - id: broad-license
            result: false
            evidence: "Telegram's Content Licensing ToS grants only a 'retractable, limited, non-exclusive, non-transferable and non-sublicensable' license, scoped strictly to service operation."
            source: "https://telegram.org/tos/content-licensing"
          - id: ai-training
            result: false
            evidence: "Telegram explicitly prohibits using platform data for AI/ML training, fine-tuning, or benchmarking."
            source: "https://telegram.org/tos/content-licensing"
          - id: data-selling
            result: false
            evidence: "Telegram does not sell user data to third parties. Its advertising platform targets based on channel topics, not user personal data."
            source: "https://telegram.org/privacy"
          - id: ad-targeting
            result: false
            evidence: "Telegram Ads targets public channels by topic, not individual users. The platform does not collect user data for ad targeting."
            source: "https://ads.telegram.org/guidelines"
    notes: "Telegram has strong user data ownership protections. Narrow operational license, explicit ban on AI training, no data selling, and no personal ad targeting."

  agent_friendly:
    value: "yes"
    by_model:
      claude-sonnet-4-20250514:
        value: "yes"
        checks:
          - id: documented-api
            result: true
            evidence: "Telegram provides two publicly documented APIs: the Bot API (HTTP-based) and the full MTProto API (via TDLib), both free for individual use."
            source: "https://core.telegram.org/bots/api"
          - id: standard-auth
            result: true
            evidence: "The Bot API uses token-based authentication (tokens generated via @BotFather). The MTProto API uses API ID/hash plus phone-based auth."
            source: "https://core.telegram.org/bots/api"
          - id: no-anti-automation
            result: true
            evidence: "There are no CAPTCHAs or anti-bot barriers for API usage. Rate limits are reasonable and well-documented, with paid options to increase them."
            source: "https://core.telegram.org/bots/faq"
          - id: machine-readable-output
            result: true
            evidence: "The Bot API returns all responses in JSON format with a consistent structure."
            source: "https://core.telegram.org/bots/api"
          - id: programmatic-crud
            result: true
            evidence: "The Bot API supports sending/reading/editing/deleting messages and managing chats programmatically. The MTProto API provides full CRUD for all Telegram operations."
            source: "https://core.telegram.org/bots/api"
    notes: "Telegram is highly agent-friendly with two well-documented APIs, simple token auth, JSON responses, reasonable rate limits, and full programmatic CRUD capabilities."

