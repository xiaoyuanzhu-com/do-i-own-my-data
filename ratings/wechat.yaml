date: 2026-03-12
models:
  - claude-sonnet-4-20250514

overall:
  grade: D
  score: 22

criteria:
  read:
    grade: C
    by_model:
      claude-sonnet-4-20250514:
        grade: C
        checks:
          - id: bulk-export
            result: true
            evidence: "WeChat offers a personal data export feature via Settings > Privacy > My Information & Authorizations > Export Personal Data. Data is delivered as a password-protected zip file within three business days."
            source: "https://help.wechat.com/cgi-bin/micromsg-bin/oshelpcenter?opcode=2&id=180502NFZfIN180502v2eU7R"
          - id: covers-all-types
            result: false
            evidence: "The export only covers Moments data, Favorites data, and account information. Chat history is explicitly excluded because it is not stored on WeChat servers."
            source: "https://help.wechat.com/cgi-bin/micromsg-bin/oshelpcenter?opcode=2&id=171213ezniaf1712137znmer&lang=en&plat=2&Channel=helpcenter"
          - id: open-format
            result: false
            evidence: "WeChat delivers exported data as a password-protected zip file, but does not publicly document the format of files inside the archive."
            source: "https://cs.help.wechat.com/hc/en-us/articles/11916362921871-FAQ-for-Data-Export"
          - id: api-read
            result: false
            evidence: "WeChat's APIs are designed for Official Account and Mini Program operators, not individual end users reading their personal data."
            source: "https://developers.weixin.qq.com/doc/offiaccount/en/Getting_Started/Overview.html"
          - id: realtime-read
            result: false
            evidence: "No real-time or streaming read access is available for individual users to access their personal data programmatically."
    notes: "Limited bulk export exists (Moments, Favorites only — excludes chats). No open format, no API, no real-time. Grade C: bulk-export only."

  write:
    grade: F
    by_model:
      claude-sonnet-4-20250514:
        grade: F
        checks:
          - id: import-from-file
            result: false
            evidence: "WeChat does not support importing data from files such as CSV or JSON. There is no mechanism to import chat history or other data from external file formats."
          - id: import-from-service
            result: false
            evidence: "WeChat does not support migrating data from other messaging services. The only migration supported is transferring WeChat chat history between WeChat devices."
            source: "https://help.wechat.com/cgi-bin/micromsg-bin/oshelpcenter?opcode=2&lang=en&plat=ios&id=1208117b2mai150512qqIbiQ&Channel=helpcenter"
          - id: api-write
            result: false
            evidence: "WeChat's APIs allow Official Account operators to send messages to followers, but individual users cannot write personal data programmatically."
            source: "https://developers.weixin.qq.com/doc/offiaccount/en/Getting_Started/Overview.html"
          - id: bulk-upload
            result: false
            evidence: "No bulk upload mechanism exists for individual users to import data into WeChat."
    notes: "All checks fail. No file import, no service migration, no API write, no bulk upload. Grade F."

  understand:
    grade: F
    by_model:
      claude-sonnet-4-20250514:
        grade: F
        checks:
          - id: open-format
            result: false
            evidence: "The exported data comes as a password-protected zip, but WeChat does not document or guarantee that the contained files are in open, non-proprietary formats."
            source: "https://cs.help.wechat.com/hc/en-us/articles/11916362921871-FAQ-for-Data-Export"
          - id: documented-schema
            result: false
            evidence: "WeChat does not publish a schema or data dictionary for the exported personal data package."
          - id: standard-schema
            result: false
            evidence: "There is no indication that WeChat's exported data follows any industry-standard schema for messaging or social media data."
          - id: human-readable
            result: false
            evidence: "Without documented formats or schemas, and with password-protected proprietary packaging, the exported data is not readily human-readable without reverse engineering."
    notes: "All checks fail. No open format, no documented schema, not human-readable. Grade F."

  delete:
    grade: B
    by_model:
      claude-sonnet-4-20250514:
        grade: B
        checks:
          - id: granular-delete
            result: true
            evidence: "Users can long-press individual messages and delete them, select multiple messages for batch deletion, and clear entire chat conversations."
            source: "https://cs.help.wechat.com/hc/en-us/articles/11917925363343-How-to-Delete-My-Chat-History"
          - id: full-delete
            result: true
            evidence: "Users can delete their entire WeChat account through Settings. After account deletion, it may take up to 60 days for all data to be fully removed."
            source: "https://www.oreateai.com/blog/a-stepbystep-guide-to-closing-your-wechat-account/2fa3245fc68c643c19ffa0dfa0bc5d03"
          - id: clear-retention
            result: false
            evidence: "WeChat's privacy policy states data is not retained longer than necessary but does not specify concrete retention periods for most data types."
            source: "https://www.wechat.com/en/privacy_policy.html"
          - id: backup-removal
            result: false
            evidence: "WeChat states that deleted data may still exist in backups or caches of other users and third parties. No stated timeline for backup removal."
            source: "https://www.wechat.com/en/privacy_policy.html"
    notes: "Granular and full deletion available, but no clear retention policy. Grade B: granular-delete AND full-delete."

  ownership:
    grade: F
    by_model:
      claude-sonnet-4-20250514:
        grade: F
        checks:
          - id: broad-license
            result: true
            evidence: "WeChat's ToS grants Tencent a perpetual, non-exclusive, transferable, sub-licensable, royalty-free, worldwide license to use user content for providing, promoting, developing, and improving WeChat and other services."
            source: "https://www.wechat.com/en/service_terms.html"
          - id: ai-training
            result: true
            evidence: "The broad license covering 'developing and trying to improve WeChat and other services' encompasses AI/ML training without explicit opt-in."
            source: "https://www.wechat.com/en/service_terms.html"
          - id: data-selling
            result: false
            evidence: "WeChat's privacy policy does not explicitly state it sells user data to third parties. However, data is shared with affiliates within the Tencent ecosystem."
            source: "https://www.wechat.com/en/privacy_policy.html"
          - id: ad-targeting
            result: true
            evidence: "WeChat Ads uses user behavioral data, interests, demographics, location, and Mini Program usage to enable precision-targeted advertising."
            source: "https://www.w-4.ch/en/wechat-ads"
    notes: "Broad perpetual license, AI training without opt-in, aggressive ad targeting. Grade F: broad-license AND (ai-training OR ad-targeting)."

  agent_friendly:
    grade: F
    by_model:
      claude-sonnet-4-20250514:
        grade: F
        checks:
          - id: documented-api
            result: false
            evidence: "WeChat's documented APIs (Official Account API, Mini Program API) are for business operators, not individual users. Full API access requires a Verified Service Account with a Chinese business entity."
            source: "https://kawo.com/en/blog/how-to-open-a-wechat-official-account-oa-and-apply-for-verification"
          - id: standard-auth
            result: true
            evidence: "The WeChat API uses OAuth 2.0 for authentication, which is a standard protocol."
            source: "https://wechat-oauth2.readthedocs.io/en/latest/api.html"
          - id: no-anti-automation
            result: false
            evidence: "WeChat actively restricts automation and has anti-bot measures. The platform restricts unofficial API usage and requires verified business accounts for programmatic access."
          - id: machine-readable-output
            result: true
            evidence: "The WeChat Official Account API returns JSON responses, which is a standard machine-readable format."
            source: "https://developers.weixin.qq.com/doc/offiaccount/en/Getting_Started/Overview.html"
          - id: programmatic-crud
            result: false
            evidence: "Individual users cannot perform read, write, or delete operations on their personal data via API. The API is limited to business-facing operations."
            source: "https://developers.weixin.qq.com/doc/offiaccount/en/Getting_Started/Overview.html"
    notes: "APIs exist only for business operators. No personal data CRUD for individuals. Grade F: no programmatic access for personal data."

