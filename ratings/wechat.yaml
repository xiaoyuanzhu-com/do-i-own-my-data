date: 2026-03-04
reviewer: xiaoyuanzhu

criteria:
  read:
    rating: "no"
    notes: >
      WeChat provides no meaningful way to read your data outside the app. There is no
      user-facing API — the Official Account API and Mini Program API are for businesses
      only. The limited personal data export (Me > Settings > Privacy > My Information)
      only covers Moments posts, Favorites, and basic account info — chat history is
      excluded because WeChat states it is not stored on servers. The desktop "Backup and
      Restore" saves chat history in a proprietary encrypted format that can only be
      restored within WeChat itself. There is no webhook, streaming API, or real-time
      access. Unofficial tools exist (wechat-export on GitHub) but require rooted/
      jailbroken devices and violate ToS.

  write:
    rating: "no"
    notes: >
      There is no way to import data into WeChat from outside. No import API, no bulk
      upload, no migration tool from other messaging platforms. The only way to get
      chat history into WeChat is via the "Backup and Restore" feature between WeChat
      installations on different devices — never from an external source. You cannot
      import contacts, messages, or media from any other service.

  understand:
    rating: "no"
    notes: >
      The official personal data export is delivered as a password-protected ZIP with
      undocumented internal formats. The desktop chat backup uses a proprietary encrypted
      format readable only by WeChat. There is no JSON, CSV, XML, or any standard format
      offered. Third-party tools can extract chat databases from rooted Android or
      jailbroken iOS devices into HTML or JSON, but this requires accessing WeChat's
      encrypted SQLite databases — not an officially supported workflow. Even when
      extracted, the schema is undocumented and reverse-engineered.

  delete:
    rating: partial
    notes: >
      Users can delete individual messages from their own view within chats, though this
      does not remove them from the recipient's device. Full account deletion is available
      via Me > Settings > Account Security > WeChat Security Center > Account Cancellation,
      with a cooling-off period of 15 days (Android) or 60 days (iOS). Account deletion
      removes associated data, though aggregated registration data is retained for spam
      prevention and login data is kept up to 90 days. There is no granular "delete all
      my data but keep my account" option.

  ownership:
    rating: "yes"
    notes: >
      Tencent's terms grant the company broad rights over user content. WeChat's privacy
      policy allows data to be used for service improvement, advertising, and shared with
      Tencent group companies. In China, content posted on WeChat may be subject to
      government access requests. WeChat collects extensive metadata (contacts, location,
      device info, usage patterns). The platform's business model relies partly on
      targeted advertising using user data. Content shared on Moments or groups may be
      analyzed for content moderation and recommendation purposes.

  agent_friendly:
    rating: "no"
    notes: >
      WeChat is fundamentally hostile to automation for individual users. There is no
      personal-use API, no OAuth for user data access, no documented data formats, and
      no way to programmatically read or write personal messages. The Official Account
      API requires a verified Chinese business entity. Unofficial automation tools risk
      account suspension. An AI agent has zero viable path to interact with a user's
      WeChat data through sanctioned means.

