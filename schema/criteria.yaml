# Grade scale used across all criteria: S, A, B, C, D, F
# Higher is always better for the user. See judges/rules.md for full grading logic.

grades:
  S: Perfect — exemplary data ownership
  A: Excellent — core capabilities with minor gaps
  B: Good — solid baseline, some limitations
  C: Mediocre — minimal viable capability
  D: Poor — technically possible but major friction
  F: Fail — no meaningful capability

overall:
  weights:
    read: 0.30
    ownership: 0.20
    delete: 0.20
    understand: 0.15
    write: 0.15
  grade_to_score:
    S: 100
    A: 80
    B: 60
    C: 40
    D: 20
    F: 0
  score_to_grade:
    - { min: 90, grade: S }
    - { min: 75, grade: A }
    - { min: 55, grade: B }
    - { min: 35, grade: C }
    - { min: 15, grade: D }
    - { min: 0, grade: F }

criteria:
  - id: read
    name: Read
    question: Can I read my data?
    note: >
      Not just viewing in the app. Can you export, download, or access your data
      programmatically — via API, bulk export, sync, or real-time streaming? Covers
      both batch (download a ZIP) and incremental (API, webhooks) access. Completeness
      and freshness of the data matter too.

  - id: write
    name: Write
    question: Can I write my data?
    note: >
      Can you bring data into the product from outside? Import from another service,
      restore from a backup, push via API, or bulk upload. This is about getting data
      in, not just creating it through the product's own UI.

  - id: understand
    name: Understand
    question: Can I understand my data?
    note: >
      Once you have your data, does it make sense? Is it in open, standard formats
      (JSON, CSV, XML) with clear schema and documentation? Or is it a proprietary
      blob of IDs and encoded fields that requires reverse-engineering? If the data is
      understandable, it's portable — humans and AI agents can interpret and move it.

  - id: delete
    name: Delete
    question: Can I delete my data?
    note: >
      Can you truly remove your data — not just hide it? This includes deletion from
      backups and a clear retention policy. Covers both granular deletion (individual
      records) and full account data removal.

  - id: ownership
    name: Ownership
    question: Do I own my data?
    note: >
      Even if you can export your data, does the platform claim rights over it? Some
      services grant themselves broad licenses to use, sublicense, or sell your data —
      for ad targeting, AI training, or third-party sales. This criterion checks whether
      the platform treats your data as theirs to exploit, beyond what's needed to
      provide the service. Higher grade = more user ownership.

